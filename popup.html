<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chess Move Analyzer</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body.fullscreen { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; }
    .fullscreen .board { max-width: 500px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <h1>♟ Chess Move Analyzer</h1>
      <div class="header-btns">
        <button id="fullscreenBtn" class="icon-btn" title="Open Fullscreen" onclick="if(!analysisResult)return;chrome.storage.local.set({lastAnalysis:analysisResult,lastChatHistory:chatHistory,lastPlies:plies,lastPly:currentPly});chrome.tabs.create({url:chrome.runtime.getURL('fullscreen.html')})">⛶ Full</button>
        <button id="settingsBtn" class="icon-btn" title="API Settings">⚙ Keys</button>
      </div>
    </div>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="panel hidden">
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="Enter your API key">
      </div>
      <div class="form-group">
        <label>Provider</label>
        <select id="provider">
          <option value="gemini">Gemini</option>
          <option value="openai_compatible">OpenAI Compatible</option>
          <option value="azure_openai">Azure OpenAI</option>
        </select>
      </div>
      <div class="form-group openai-field hidden">
        <label>Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.deepseek.com">
      </div>
      <div class="form-group">
        <label>Vision Model (images)</label>
        <input type="text" id="visionModel" placeholder="gpt-4o">
      </div>
      <div class="form-group">
        <label>Text Model (moves + chat)</label>
        <input type="text" id="textModel" placeholder="deepseek-chat">
      </div>
      <div class="form-group">
        <label>Vision Provider (optional)</label>
        <select id="visionProvider">
          <option value="">Same as main</option>
          <option value="gemini">Gemini</option>
          <option value="openai_compatible">OpenAI Compatible</option>
          <option value="azure_openai">Azure OpenAI</option>
        </select>
      </div>
      <div class="form-group" id="visionApiKeyGroup" style="display:none">
        <label>Vision API Key</label>
        <input type="password" id="visionApiKey" placeholder="Leave empty for main key">
      </div>
      <div class="form-group azure-field hidden">
        <label>API Version</label>
        <input type="text" id="apiVersion" placeholder="2024-02-15-preview">
      </div>
      <button id="saveSettings" class="btn primary">Save Settings</button>
    </div>

    <!-- Input Panel -->
    <div id="inputPanel" class="panel">
      <div id="noApiWarning" class="warning hidden">
        ⚠ No API key set — <a href="#" id="openSettingsLink">click here to configure</a>
      </div>
      <div class="form-group">
        <label>Paste moves or upload score sheet</label>
        <textarea id="movesInput" rows="4" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5..."></textarea>
      </div>
      <div class="row">
        <input type="file" id="imageUpload" accept="image/*" style="display:none">
        <button id="uploadBtn" class="btn secondary">📷 Upload Photo</button>
        <select id="skillLevel" class="select-sm">
          <option>Beginner (<1200)</option>
          <option selected>Intermediate (1200-1800)</option>
          <option>Advanced (1800+)</option>
          <option>Master (2200+)</option>
        </select>
      </div>
      <button id="analyzeBtn" class="btn primary full">Analyze Moves</button>
      <div id="editMovesSection" class="hidden" style="margin-top:8px">
        <label style="font-size:11px;color:#888">Edit transcribed moves, then re-analyze:</label>
        <textarea id="editMovesInput" rows="3" style="width:100%;margin:4px 0;background:#16213e;border:1px solid #333;border-radius:6px;color:#e0e0e0;font-family:monospace;font-size:12px;padding:6px"></textarea>
        <button id="reanalyzeBtn" class="btn primary" style="width:100%">Re-Analyze Edited Moves</button>
      </div>
      <div id="analyzeStatus" class="status hidden"></div>
    </div>

    <!-- Analysis Results -->
    <div id="resultsPanel" class="panel hidden">
      <div class="result-header">
        <span id="openingName" class="opening"></span>
        <span id="evaluation" class="eval"></span>
        <a id="fullscreenLink" class="btn-sm" href="#" target="_blank" style="display:none;text-decoration:none">⛶ Open in tab</a>
      </div>

      <!-- Chess Board -->
      <div id="chessboard" class="board"></div>
      <div class="board-controls">
        <button id="btnFirst">⏮</button>
        <button id="btnPrev">◀</button>
        <span id="moveLabel" class="move-label">Start</span>
        <button id="btnNext">▶</button>
        <button id="btnLast">⏭</button>
        <button id="btnFlip" class="btn-sm">Flip</button>
      </div>

      <!-- Moves list -->
      <div id="movesChips" class="moves-chips"></div>

      <!-- Tactical Misses -->
      <div id="tacticalMisses" class="card hidden"></div>

      <!-- Positional Insights -->
      <div id="positionalInsights" class="card hidden"></div>

      <!-- Endgame Strategy -->
      <div id="endgameStrategy" class="card hidden"></div>

      <!-- Summary -->
      <div id="summary" class="card"></div>

      <!-- Chat -->
      <div class="chat-section">
        <h3>💬 Ask the Coach</h3>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Ask about the game...">
          <button id="chatSend" class="btn primary">Send</button>
        </div>
      </div>
    </div>
  </div>
  <script src="lib/llm.js"></script>
  <script src="popup.js"></script>
</body>
</html>
